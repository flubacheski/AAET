<p>Em caso de <strong>avaliação substitutiva</strong>, a nota substituirá a prova que maximizar a média final.</p>
</section>

<h1 id="delta">Delta</h1>
<p>Ao final do semestre, caso o aluno possua <strong>média final maior ou igual a 5</strong>, mas estiver bloqueado por um critério de barreira de aprovação (<strong>média das provas menor que 5</strong>), a <strong>prova substitutiva</strong> será considerada como <strong>prova delta</strong>. A <strong>nota da delta deve ser maior ou igual a 5</strong> para a aprovação na disciplina. Caso contrário, o aluno estará reprovado na disciplina (mesmo que tiver média superior a 5).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="16" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/livro.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="16" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="bibliografia-b%C3%A1sica">Bibliografia básica</h1>

<h3 id="algoritmos-teoria-e-pr%C3%A1tica">Algoritmos: Teoria e Prática</h3>
<h3 id="cormen-t-h-leiserson-c-e-rivest-r-l-stein-c">CORMEN, T. H.; LEISERSON, C. E.; RIVEST, R. L; STEIN, C.</h3>
<h3 id="site-httpmitpressmitedualgorithms">site: <a href="http://mitpress.mit.edu/algorithms/">http://mitpress.mit.edu/algorithms/</a></h3>
<h2 id="este-livro-%C3%A9-realmente-muito-importante-para-disciplina">Este livro é realmente muito importante para disciplina!</h2>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="4" style="" data-marpit-pagination-total="16" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">
<h1 id="o-que-iremos-aprender-na-disciplina">O que iremos aprender na disciplina ?</h1>
<ul>
<li data-marpit-fragment="1">
<p>Nessa disciplina iremos aprender a medir a eficiência de algoritmos, ou seja, calcular o <strong>tempo de execução</strong> do algoritmo.</p>
</li>
<li data-marpit-fragment="2">
<p>A partir do <strong>tempo de execução</strong> do algoritmo é possível comparar algoritmos que resolvam um mesmo problema.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">
<h1 id="como-calcular-o-tempo-de-execu%C3%A7%C3%A3o-de-um-algoritmo">Como calcular o <strong>tempo de execução</strong> de um algoritmo ?</h1>
<blockquote>
<p>Para obter o <strong>tempo de execução</strong> de um algoritmo poderíamos implementar o algoritmo e realizar vários testes para várias entradas. Mas ai surge algumas questões:</p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<p>O hardware (memória,  processador, disco, etc..) influencia ?</p>
</li>
<li data-marpit-fragment="2">
<p>E qual a influência do software (SO, linguagem de programação, compilador, código é intretado, etc ) ?</p>
</li>
<li data-marpit-fragment="3">
<p>Nesse caso, você estaria comparando <strong>implementações</strong>, e não <strong>algoritmos</strong>.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="7" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">
<h1 id="como-calcular-o-tempo-de-execu%C3%A7%C3%A3o-de-um-algoritmo-1">Como calcular o <strong>tempo de execução</strong> de um algoritmo ?</h1>
<ul>
<li data-marpit-fragment="1">
<p>Podemos <strong>abstrair</strong> o problema, ou seja, focar propriedades essenciais para calcular o <strong>tempo de execução</strong>, desconsiderando os detalhes de implementação que não são relevantes para o nível de análise realizado.</p>
</li>
<li data-marpit-fragment="2">
<p>Em vez de perguntar</p>
<ul>
<li data-marpit-fragment="3">&quot;<strong>Quantos segundos</strong> o algoritmo demora?&quot;</li>
</ul>
</li>
<li data-marpit-fragment="4">
<p>Perguntamos</p>
<ul>
<li data-marpit-fragment="5">&quot;<strong>Quantas operações</strong> o algoritmo executa em função do tamanho da entrada?&quot;</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="4" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">

<h1 id="abstra%C3%A7%C3%A3o-em-an%C3%A1lise-de-algoritmos-1">Abstração em Análise de Algoritmos</h1>
<p>Na Análise de Algoritmos, a abstração consiste em ignorar os detalhes específicos da implementação — como linguagem de programação, compilador e hardware — e representar o <strong>custo de um algoritmo apenas em função do tamanho da entrada</strong>.</p>
<p>Essa abstração permite comparar algoritmos de maneira geral, utilizando funções matemáticas e notações assintóticas, como <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.726ex" height="1.643ex" role="img" focusable="false" viewBox="0 -704 763 726"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g></g></g></svg></mjx-container>, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.726ex" height="1.643ex" role="img" focusable="false" viewBox="0 -704 763 726"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6E9" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM640 466Q640 523 625 565T583 628T532 658T479 668Q370 668 273 559T151 255Q150 245 150 213Q150 156 165 116T207 55T259 26T313 17Q385 17 451 63T561 184Q590 234 615 312T640 466ZM510 276Q510 278 512 288L515 298Q515 299 384 299H253L250 285Q246 271 244 268T231 265H227Q216 265 214 266T207 274Q207 278 223 345T244 416Q247 419 260 419H263Q280 419 280 408Q280 406 278 396L275 386Q275 385 406 385H537L540 399Q544 413 546 416T559 419H563Q574 419 576 418T583 410Q583 403 566 339Q549 271 544 267Q542 265 538 265H530H527Q510 265 510 276Z"></path></g></g></g></svg></mjx-container> e <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" <h1 id="objetivos-da-disciplina">Objetivos da disciplina</h1>
<ol>
<li>
<p><strong>Identificar</strong> e <strong>demonstrar</strong> a complexidade de espaço e tempo de algoritmos utilizando notação assintótica;</p>
</li>
<li>
<p><strong>Projetar</strong> e <strong>implementar</strong> algoritmos utilizando divisão e conquista, programação dinâmica e estratégias gulosas;</p>
</li>
<li>
<p><strong>Descrever</strong> as intuições e funcionamento de algoritmos no contexto de <strong>entrevistas técnicas de programação</strong>.</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">
<h1 id="o-que-%C3%A9-uma-entrevista-t%C3%A9cnica">O que é uma entrevista técnica ?</h1>
<ul>
<li data-marpit-fragment="1">
<p>Uma entrevista técnica é um processo de avaliação em que o candidato deve demonstrar sua capacidade de resolver problemas, justificando suas escolhas e avaliando a eficiência das soluções utilizando conceitos como complexidade;</p>
</li>
<li data-marpit-fragment="2">
<p>Normalmente utilizado no processo seletivo em empresas de tecnologia (Google, Microsoft, Amazon, Meta, Nubank, iFood, entre outras);</p>
</li>
<li data-marpit-fragment="3">
<p><strong>Exemplo de Problema</strong>: &quot;<em>Dado uma sequencia de números inteiros, determine a maior diferença absoluta entre dois elementos da sequência ?</em>&quot;</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">
<h1 id="o-que-precisa-saber-em-uma-entrevista-t%C3%A9cnica">O que precisa saber em uma entrevista técnica ?</h1>
<ul>
<li data-marpit-fragment="1">
<p>Entendimento do problema, caso não esteja claro faça perguntas para evitar ambiguidade;</p>
</li>
<li data-marpit-fragment="2">
<p>Proponha uma solução, mesmo usando força-bruta;</p>
</li>
<li data-marpit-fragment="3">
<p>Análise de solução e definição da complexidade da solução;</p>
</li>
<li data-marpit-fragment="4">
<p>Propor melhorias na solução de forma a diminuir a complexidade;</p>
</li>
<li data-marpit-fragment="5">
<p>A solução funciona para todos os casos;</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-color="#fff" data-theme="default" lang="pt-BR" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:default;background-color:#fff;background-image:none;" data-marpit-pagination-total="16">
